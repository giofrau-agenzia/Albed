function findBandIndex(bands, value) {
  for (let i = 0; i < bands.length; i++) {
    const b = bands[i];
    if (value <= b.max && (value > b.min || i === 0)) return i;
  }
  return bands.length - 1;
}

  const isFolding = sistema === "soffietto";
  const panelTypesForCollection = isFolding
    ? FOLDING_COLLECTION_PANEL_TYPES[collectionId] || QUADRA_FOLDING_PANEL_TYPES
    : COLLECTION_PANEL_TYPES[collectionId] || QUADRA_PANEL_TYPES;
  const handlesEntry = isFolding
    ? FOLDING_HANDLES_BY_COLLECTION[collectionId] || QUADRA_FOLDING_HANDLES
    : HANDLES_BY_COLLECTION[collectionId] || HANDLES;
  const handlesForCollection = Array.isArray(handlesEntry) ? handlesEntry : handlesEntry[panelTypeId] || HANDLES;
  const panelType = panelTypesForCollection.find((p) => p.id === panelTypeId) || panelTypesForCollection[0];
  const collectionLabel = COLLECTIONS.find((c) => c.id === collectionId)?.label || "Quadra";

  // Step 5 — maniglia
  const [handleId, setHandleId] = useState("adige100");

  // Sconto finale (Step 6 — riepilogo)
  const [discountPct, setDiscountPct] = useState(0);
  const [lockId, setLockId] = useState("solo");

  const railOptionsRaw = RAIL_BY_APPLICATION[applicazione];
  const railOptions = collectionId === "sail" ? railOptionsRaw.filter((r) => r.id !== "3vie") : railOptionsRaw;
  const isWall = applicazione === "parete" || applicazione === "parete-soffitto";

  const breakdown = useMemo(() => {
    const items = [];

    // pannello — larghezza per singola anta (approssimazione: luce vano / numero ante)
    const larghezzaAnta = larghezza / numAnte;

    // And a binario invisibile: il foro di passaggio deve essere più piccolo del pannello massimo
    // disponibile (H: -6cm, L: -11,5cm) — oltre questi limiti la configurazione non è realizzabile
    if (collectionId === "and") {
      const wBandsAnd = panelType.widthBands || WIDTH_BANDS;
      const hBandsAnd = panelType.heightBands || HEIGHT_BANDS;
      const maxPanelWidth = wBandsAnd[panelType.widthCols - 1].max;
      const maxPanelHeight = hBandsAnd[panelType.heightRows - 1].max;
      const maxForoWidth = maxPanelWidth - 115;
      const maxForoHeight = maxPanelHeight - 60;
      if (larghezzaAnta > maxForoWidth || altezza > maxForoHeight) {
        return {
          items: [],
          total: 0,
          wBand: null,
          hBand: null,
          incompatible: true,
          incompatibleReason: `Foro di passaggio troppo grande per And: massimo L ${maxForoWidth}mm x H ${maxForoHeight}mm (il pannello deve superare il foro di 11,5cm in larghezza e 6cm in altezza, e il pannello più grande disponibile è L ${maxPanelWidth}mm x H ${maxPanelHeight}mm).`,
        };
      }
    }

    const wBands = panelType.widthBands || WIDTH_BANDS;
    const hBands = panelType.heightBands || HEIGHT_BANDS;
    let wIdx = findBandIndex(wBands, larghezzaAnta);
    wIdx = Math.min(wIdx, panelType.widthCols - 1);
    let hIdx = findBandIndex(hBands, altezza);
    hIdx = Math.min(hIdx, panelType.heightRows - 1);
    const wBand = wBands[wIdx];
    const hBand = hBands[hIdx];

    let basePanel = panelType.table[hIdx][wIdx];
    if (basePanel == null) {
      // fascia non disponibile per questa combinazione L/H: ripiega sull'ultima fascia larghezza valida della riga
      for (let i = wIdx; i >= 0 && basePanel == null; i--) basePanel = panelType.table[hIdx][i];
    }
    const finish = panelType.finishes.find((f) => f.id === finishId) || panelType.finishes[0];

    // il pannello base viene maggiorato per primo; categoria vetro e divisioni sono voci
    // separate calcolate sul prezzo del pannello GIÀ maggiorato (confermato su preventivo reale)
    const panelUnitPrice = basePanel * MARKUP;

    const div = panelType.hasDivisions ? DIVISIONS.find((d) => d.id === division) : { id: "intero", label: "", delta: 0, code: panelType.baseCode };
    const divCode = (panelType.divisionCodes && panelType.divisionCodes[div.id]) || div.code;

    // varianti anta senza impatto sul prezzo (es. Celine) — solo per la codifica
    const isUnoActive = railSystem === "uno" && applicazione === "soffitto" && panelType.unoCompatible;
    let itemCode;
    if (panelType.variants) {
      const validVariants = panelType.variants.filter((v) => wBand.min >= v.min && wBand.max <= v.max);
      const variant = validVariants.find((v) => v.id === variantId) || validVariants[0] || panelType.variants[0];
      itemCode = `${variant.code}${isUnoActive ? "U" : ""}_${wBand.code}x${hBand.code}`;
    } else {
      // il codice pannello resta sempre quello base (intero): le divisioni sono una riga a parte
      itemCode = `${panelType.baseCode}${isUnoActive ? "U" : ""}_${wBand.code}x${hBand.code}`;
    }

    const glassNamedLabel = panelType.id === "vetro-singolo" ? (GLASS_NAMED_FINISHES.find((g) => g.id === glassFinishNameId) || {}).label : null;

    items.push({
      code: itemCode,
      desc: `${collectionLabel} ${panelType.label}${glassNamedLabel ? ` — ${glassNamedLabel}` : ""} (L ${wBand.label} x H ${hBand.label} mm)${
        frameFinishId ? `, telaio ${(FRAME_FINISHES.find((f) => f.id === frameFinishId) || {}).label || ""}` : ""
      }`,
      qty: numAnte,
      unit: panelUnitPrice,
      total: panelUnitPrice * numAnte,
    });

    // categoria/finitura vetro — voce separata, calcolata sul prezzo pannello già maggiorato
    if (finish.type === "pct" && (finish.value[wIdx] || 0) > 0) {
      const pct = finish.value[wIdx];
      const catUnit = panelUnitPrice * (pct / 100);
      items.push({
        code: "Cat-V",
        desc: `Categoria vetro (${finish.label}, +${pct}%)`,
        qty: numAnte,
        unit: catUnit,
        total: catUnit * numAnte,
      });
    } else if (finish.type === "flat" && finish.value > 0) {
      items.push({
        code: `FIN-${finish.id.toUpperCase()}`,
        desc: `Finitura — ${finish.label}`,
        qty: numAnte,
        unit: finish.value * MARKUP,
        total: finish.value * MARKUP * numAnte,
      });
    }

    // pattern stampato (Kodama/Komorebi) — sovrapprezzo fisso oltre alla categoria
    if (panelType.id === "vetro-singolo") {
      const namedGlass = GLASS_NAMED_FINISHES.find((g) => g.id === glassFinishNameId);
      if (namedGlass && namedGlass.flatExtra) {
        const patternUnit = namedGlass.flatExtra * MARKUP;
        items.push({
          code: "PATTERN-800",
          desc: `Pattern stampato — ${namedGlass.label}`,
          qty: numAnte,
          unit: patternUnit,
          total: patternUnit * numAnte,
        });
      }
    }

    // personalizzazioni (pantografatura) — solo And, non disponibile con certe finiture
    if (panelType.groovingOptions) {
      const groovingBlocked = panelType.groovingIncompatibleFinish && finish.id === panelType.groovingIncompatibleFinish;
      const grooving = panelType.groovingOptions.find((g) => g.id === groovingId) || panelType.groovingOptions[0];
      if (!groovingBlocked && grooving.delta > 0) {
        const groovingUnit = grooving.delta * MARKUP;
        items.push({
          code: grooving.code,
          desc: `PERSONALIZZAZIONI ${panelType.label} — ${grooving.label}`,
          qty: numAnte,
          unit: groovingUnit,
          total: groovingUnit * numAnte,
        });
      }
    }

    // personalizzazioni (divisioni) — voce separata
    if (panelType.hasDivisions && div.id !== "intero") {
      const divUnit = div.delta * MARKUP;
      items.push({
        code: divCode,
        desc: `PERSONALIZZAZIONI ${panelType.label} — ${div.label}`,
        qty: numAnte,
        unit: divUnit,
        total: divUnit * numAnte,
      });
    }

    // binario — And (a scomparsa, incluso nel prezzo pannello, nessuna voce separata) / Sail (dedicato a parete) / Soffietto (Evo 1via) / Evo / Uno
    let railLengthM = larghezza / 1000;
    if (collectionId === "and") {
      // il binario a scomparsa è già compreso nel prezzo del pannello: nessuna voce aggiuntiva
    } else if (isFolding) {
      // sistema soffietto: sempre binario Evo a soffitto 1 via, con trave da incasso opzionale
      const foldingRail = RAIL_BY_APPLICATION.soffitto.find((r) => r.id === "1via");
      items.push({
        code: foldingRail.code,
        desc: "Binario Evo a soffitto 1 via (soffietto)",
        qty: `${railLengthM.toFixed(1)}`,
        unit: foldingRail.pricePerMl * MARKUP,
        total: foldingRail.pricePerMl * railLengthM * MARKUP,
      });
      if (travaIncasso && BUILTIN_BEAM_BY_VIA["1via"]) {
        const beam = BUILTIN_BEAM_BY_VIA["1via"];
        items.push({
          code: beam.code,
          desc: "Trave da incasso per binario Evo a soffitto (soffietto)",
          qty: `${railLengthM.toFixed(1)}`,
          unit: beam.pricePerMl * MARKUP,
          total: beam.pricePerMl * railLengthM * MARKUP,
        });
      }
    } else if (collectionId === "sail") {
      railLengthM = larghezza / 1000;
      items.push({
        code: SAIL_RAIL.code,
        desc: "Binario Sail a parete (1 via)",
        qty: `${railLengthM.toFixed(1)}`,
        unit: SAIL_RAIL.pricePerMl * MARKUP,
        total: SAIL_RAIL.pricePerMl * railLengthM * MARKUP,
      });
    } else if (isUnoActive) {
      const unoRail = UNO_RAIL_CEILING[railTypeId] || UNO_RAIL_CEILING["2vie"];
      railLengthM = larghezza / 1000;
      items.push({
        code: unoRail.code,
        desc: `Binario Uno a soffitto ${RAIL_BY_APPLICATION.soffitto.find((r) => r.id === railTypeId)?.label || ""}`,
        qty: `${railLengthM.toFixed(1)}`,
        unit: unoRail.pricePerMl * MARKUP,
        total: unoRail.pricePerMl * railLengthM * MARKUP,
      });
      if (panelType.unoKitPrice) {
        items.push({
          code: "Kit-Uno",
          desc: "Kit carrello per binario inferiore Uno (doppio vetro e pannelli)",
          qty: numAnte,
          unit: panelType.unoKitPrice * MARKUP,
          total: panelType.unoKitPrice * MARKUP * numAnte,
        });
      }
    } else {
      const rail = railOptions.find((r) => r.id === railTypeId) || railOptions[0];
      const railMultiplier = isWall ? 2 : 1;
      railLengthM = (larghezza / 1000) * railMultiplier;
      const railListCost = rail.pricePerMl * railLengthM;
      items.push({
        code: rail.code,
        desc: `Binario Evo ${isWall ? "a parete" : "a soffitto"} ${rail.label}`,
        qty: `${railLengthM.toFixed(1)}`,
        unit: rail.pricePerMl * MARKUP,
        total: railListCost * MARKUP,
      });

      const railOffersBeam = !isWall || applicazione === "parete-soffitto";
      if (travaIncasso && railOffersBeam && BUILTIN_BEAM_BY_VIA[railTypeId]) {
        const beam = BUILTIN_BEAM_BY_VIA[railTypeId];
        items.push({
          code: beam.code,
          desc: "Trave da incasso per binario Evo a soffitto",
          qty: `${railLengthM.toFixed(1)}`,
          unit: beam.pricePerMl * MARKUP,
          total: beam.pricePerMl * railLengthM * MARKUP,
        });
      }

      if (isWall && rail.capCode) {
        // coppia tappi di chiusura — automatica nelle configurazioni a parete
        items.push({
          code: rail.capCode,
          desc: "Coppia tappi di chiusura binario Evo",
          qty: 1,
          unit: CAP_PRICE * MARKUP,
          total: CAP_PRICE * MARKUP,
        });
      }
    }

    // profilo di battuta — sempre incluso nei sistemi Evo e Uno (non opzionale), quantità modificabile
    if (!["and", "sail"].includes(collectionId) && !isFolding) {
      const jambType = JAMB_TYPES.find((j) => j.id === jambTypeId);
      const jambCode = jambType.codeByVia[railTypeId];
      const defaultQty = parseInt(railTypeId, 10) || 1;
      const qty = profiloBattutaQty != null ? profiloBattutaQty : defaultQty;
      if (jambCode) {
        items.push({
          code: jambCode,
          desc: `Profilo di battuta per parete ${jambType.label.toLowerCase()} al binario`,
          qty,
          unit: jambType.price * MARKUP,
          total: jambType.price * MARKUP * qty,
        });
      }
    }

    // maniglia — 1 per anta
    const handle = handlesForCollection.find((h) => h.id === handleId) || handlesForCollection[0];
    const lockPrice = handle[lockId];
    if (lockPrice != null) {
      items.push({
        code: handle.label,
        desc: `Maniglia ${handle.label} — ${LOCK_TYPES.find((l) => l.id === lockId).label}`,
        qty: numAnte,
        unit: lockPrice * MARKUP,
        total: lockPrice * MARKUP * numAnte,
      });
    }

    const total = items.reduce((sum, i) => sum + i.total, 0);
    return { items, total, wBand, hBand };
  }, [larghezza, altezza, numAnte, panelTypeId, finishId, division, variantId, groovingId, railTypeId, railSystem, applicazione, profiloBattutaQty, jambTypeId, travaIncasso, handleId, lockId, railOptions, isWall, panelType, collectionId, isFolding, frameFinishId, glassFinishNameId]);

  const activeSteps = isFolding ? STEPS.filter((s) => s.id !== 3) : STEPS;
  const goNext = () => {
    const idx = activeSteps.findIndex((s) => s.id === step);
    setStep(activeSteps[Math.min(idx + 1, activeSteps.length - 1)].id);
  };
  const goBack = () => {
    const idx = activeSteps.findIndex((s) => s.id === step);
    setStep(activeSteps[Math.max(idx - 1, 0)].id);
  };

  return (
    <div
      style={{
        fontFamily: "'Barlow', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif",
        background: "#F6F4EF",
        color: "#1B1B18",
        minHeight: "100%",
      }}
    >
      <style>{`
        @media print {
          .no-print { display: none !important; }
          .print-full { grid-template-columns: 1fr !important; }
        }
      `}</style>
      <div style={{ maxWidth: 1040, margin: "0 auto", padding: "32px 24px 64px" }}>
        {/* Header */}
        <div style={{ marginBottom: 32, borderBottom: "1px solid #DBD5C7", paddingBottom: 20 }}>
          <div
            style={{
              fontFamily: "'Barlow Condensed', sans-serif",
              fontSize: 13,
              letterSpacing: "0.08em",
              color: "#8A6A3E",
              marginBottom: 6,
            }}
          >
            PANNELLI SCORREVOLI O GIREVOLI — SISTEMA EVO — LISTINO 2025 v.1.8 (+6% ricarico)
          </div>
          <h1
            style={{
              fontFamily: "'Barlow Condensed', sans-serif",
              fontWeight: 600,
              fontSize: 38,
              margin: 0,
              lineHeight: 1.1,
            }}
          >
            Configuratore Porte Scorrevoli
          </h1>
          <p style={{ color: "#5C584E", fontSize: 15, marginTop: 8, maxWidth: 620 }}>
            Pannelli scorrevoli su binario Evo, a soffitto o a parete. Prezzi e regole verificati
            su un preventivo reale.
          </p>
        </div>

        <div className="print-full" style={{ display: "grid", gridTemplateColumns: "220px 1fr", gap: 32 }}>
          {/* Step nav */}
          <div className="no-print">
            {activeSteps.map((s) => {
              const active = step === s.id;
              const done = step > s.id;
              return (
                <button
                  key={s.id}
                  onClick={() => setStep(s.id)}
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: 10,
                    width: "100%",
                    textAlign: "left",
                    padding: "10px 12px",
                    marginBottom: 4,
                    background: active ? "#1B1B18" : "transparent",
                    color: active ? "#F6F4EF" : "#1B1B18",
                    border: "1px solid " + (active ? "#1B1B18" : "transparent"),
                    borderRadius: 2,
                    cursor: "pointer",
                    fontSize: 14,
                  }}
                >
                  <span
                    style={{
                      width: 20,
                      height: 20,
                      borderRadius: "50%",
                      border: "1px solid " + (active ? "#F6F4EF" : "#8A6A3E"),
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      fontSize: 11,
                      flexShrink: 0,
                    }}
                  >
                    {done ? <Check size={12} /> : s.id}
                  </span>
                  {s.label}
                </button>
              );
            })}

            {!breakdown.incompatible && step >= 1 && (
              <div style={{ marginTop: 20, padding: "16px 8px", background: "#FFFFFF", border: "1px solid #DBD5C7" }}>
                <PanelPreview
                  numAnte={isFolding ? 1 : numAnte}
                  panelTypeId={panelTypeId}
                  division={division}
                  larghezza={larghezza}
                  altezza={altezza}
                  handleLabel={handlesForCollection.find((h) => h.id === handleId)?.label}
                  jambQty={isFolding || ["and", "sail"].includes(collectionId) ? 0 : profiloBattutaQty != null ? profiloBattutaQty : parseInt(railTypeId, 10) || 1}
                />
              </div>
            )}

            <div style={{ marginTop: 12, padding: 16, background: breakdown.incompatible ? "#F5DCD8" : "#EFEAE0", border: "1px solid " + (breakdown.incompatible ? "#B23B2E" : "#DBD5C7") }}>
              <div style={{ fontSize: 12, color: breakdown.incompatible ? "#B23B2E" : "#8A6A3E", letterSpacing: "0.05em" }}>
                {breakdown.incompatible ? "NON DISPONIBILE" : "TOTALE PARZIALE"}
              </div>
              <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontSize: breakdown.incompatible ? 15 : 28, fontWeight: 600 }}>
                {breakdown.incompatible ? "Configurazione non realizzabile" : euro(breakdown.total)}
              </div>
            </div>
          </div>

          {/* Step content */}
          <div style={{ background: "#FFFFFF", border: "1px solid #DBD5C7", padding: 28, minHeight: 380 }}>
            {step === 0 && (
              <StepBlock title="0. Sistema e collezione">
                <FieldGroup label="Sistema">
                  <OptionRow
                    selected={sistema === "scorrevole"}
                    onClick={() => {
                      setSistema("scorrevole");
                      setStep(0);
                    }}
                    label="Scorrevole"
                  />
                  <OptionRow
                    selected={sistema === "soffietto"}
                    onClick={() => {
                      setSistema("soffietto");
                      setStep(0);
                      if (!["quadra", "ritrait"].includes(collectionId)) setCollectionId("quadra");
                      if (numAnte > 1) setNumAnte(1);
                      const firstType = (FOLDING_COLLECTION_PANEL_TYPES[collectionId] || QUADRA_FOLDING_PANEL_TYPES)[0];
                      setPanelTypeId(firstType.id);
                      setFinishId(firstType.finishes[0].id);
                        setGlassFinishNameId((GLASS_NAMED_FINISHES.find((g) => g.category === firstType.finishes[0].id) || {}).id || "neutro");
                    }}
                    label="Soffietto"
                  />
                </FieldGroup>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 10, marginTop: 16 }}>
                  {COLLECTIONS.filter((c) => !isFolding || ["quadra", "ritrait"].includes(c.id)).map((c) => (
                    <button
                      key={c.id}
                      onClick={() => {
                        if (!c.available) return;
                        setCollectionId(c.id);
                        const compatFrames = FRAME_FINISH_COMPATIBILITY[c.id] || [];
                        if (!compatFrames.includes(frameFinishId)) setFrameFinishId(compatFrames[0] || null);
                        const panelTypesSrc = isFolding ? FOLDING_COLLECTION_PANEL_TYPES : COLLECTION_PANEL_TYPES;
                        const handlesSrc = isFolding ? FOLDING_HANDLES_BY_COLLECTION : HANDLES_BY_COLLECTION;
                        const firstType = (panelTypesSrc[c.id] || panelTypesSrc.quadra)[0];
                        if (!isFolding) {
                          if (!firstType.unoCompatible) setRailSystem("evo");
                          if (c.id === "sail") {
                            setApplicazione("parete");
                            if (numAnte > 2) setNumAnte(2);
                          }
                          if (c.id === "and" && numAnte > 1) setNumAnte(1);
                          if (c.id === "sail" && railTypeId === "3vie") setRailTypeId("2vie");
                        } else if (numAnte > 1) {
                          setNumAnte(1);
                        }
                        setPanelTypeId(firstType.id);
                        setFinishId(firstType.finishes[0].id);
                        setGlassFinishNameId((GLASS_NAMED_FINISHES.find((g) => g.category === firstType.finishes[0].id) || {}).id || "neutro");
                        setDivision("intero");
                        setVariantId(null);
                        const entry = handlesSrc[c.id] || HANDLES;
                        const newHandles = Array.isArray(entry) ? entry : entry[firstType.id] || HANDLES;
                        if (!newHandles.find((h) => h.id === handleId)) {
                          setHandleId(newHandles[0].id);
                          setLockId("solo");
                        }
                      }}
                      disabled={!c.available}
                      style={{
                        padding: "18px 10px",
                        border: "1px solid " + (collectionId === c.id ? "#1B1B18" : "#DBD5C7"),
                        background: collectionId === c.id ? "#F6F4EF" : c.available ? "#FFFFFF" : "#FAF9F5",
                        cursor: c.available ? "pointer" : "not-allowed",
                        textAlign: "center",
                        opacity: c.available ? 1 : 0.5,
                      }}
                    >
                      <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontSize: 17, fontWeight: 600 }}>{c.label}</div>
                      {!c.available && <div style={{ fontSize: 11, color: "#8A8577", marginTop: 4 }}>dati in arrivo</div>}
                    </button>
                  ))}
                </div>
                <p style={{ fontSize: 13, color: "#8A8577", marginTop: 16 }}>
                  Al momento solo la collezione Quadra ha listino prezzi completo. Le altre
                  collezioni verranno popolate una volta estratte le rispettive tabelle dal
                  listino.
                </p>
              </StepBlock>
            )}

            {step === 1 && (
              <StepBlock title="1. Dimensioni vano">
                <div style={{ display: "flex", gap: 20, marginBottom: 8 }}>
                  <NumberField label="Larghezza vano (mm)" value={larghezza} onChange={setLarghezza} />
                  <NumberField label="Altezza vano (mm)" value={altezza} onChange={setAltezza} />
                </div>
                {breakdown.incompatible ? (
                  <div style={{ padding: 16, marginTop: 12, background: "#F5DCD8", border: "1px solid #B23B2E" }}>
                    <p style={{ fontSize: 14, color: "#7A2A20", margin: 0 }}>{breakdown.incompatibleReason}</p>
                  </div>
                ) : (
                  <p style={{ fontSize: 13, color: "#8A8577", marginTop: 12 }}>
                    Larghezza per singola anta calcolata: {(larghezza / numAnte).toFixed(0)} mm — fascia
                    listino {breakdown.wBand.label} mm / {breakdown.hBand.label} mm
                  </p>
                )}
              </StepBlock>
            )}

            {step === 2 && (
              <StepBlock title={isFolding ? "2. Binario" : "2. Applicazione e binario"}>
                {isFolding ? (
                  <div>
                    <p style={{ fontSize: 14, color: "#5C584E" }}>
                      Il sistema soffietto utilizza sempre il binario Evo a soffitto, 1 via.
                    </p>
                    <FieldGroup label="Binario Evo a soffitto">
                      <OptionRow selected label={`1 via — ${RAIL_BY_APPLICATION.soffitto[0].code}`} price={`${euro(RAIL_BY_APPLICATION.soffitto[0].pricePerMl * MARKUP)}/ml`} />
                    </FieldGroup>
                    <FieldGroup label="Trave da incasso">
                      <OptionRow selected={!travaIncasso} onClick={() => setTravaIncasso(false)} label="Senza trave da incasso" price="incluso" />
                      <OptionRow
                        selected={travaIncasso}
                        onClick={() => setTravaIncasso(true)}
                        label="Con trave da incasso per binario a soffitto"
                        price={`${euro(BUILTIN_BEAM_BY_VIA["1via"].pricePerMl * MARKUP)}/ml`}
                      />
                    </FieldGroup>
                  </div>
                ) : collectionId === "and" ? (
                  <p style={{ fontSize: 14, color: "#5C584E" }}>
                    And utilizza un binario a scomparsa nella parete, il cui costo è già compreso
                    nel prezzo del pannello — nessuna voce di binario aggiuntiva da configurare.
                  </p>
                ) : collectionId === "sail" ? (
                  <div>
                    <p style={{ fontSize: 14, color: "#5C584E" }}>
                      Sail utilizza un binario dedicato a parete (1 via), non compatibile con il
                      sistema Evo/Uno delle altre collezioni.
                    </p>
                    <FieldGroup label="Binario Sail a parete">
                      <OptionRow selected label={`1 via — ${SAIL_RAIL.code}`} price={`${euro(SAIL_RAIL.pricePerMl * MARKUP)}/ml`} />
                    </FieldGroup>
                  </div>
                ) : (
                  <>
                    <FieldGroup label="Applicazione">
                      {APPLICAZIONI.map((a) => (
                        <OptionRow
                          key={a.id}
                          selected={applicazione === a.id}
                          onClick={() => {
                            setApplicazione(a.id);
                            const opts = RAIL_BY_APPLICATION[a.id];
                            if (!opts.find((r) => r.id === railTypeId)) setRailTypeId(opts[0].id);
                            if (a.id !== "soffitto") setRailSystem("evo");
                          }}
                          label={a.label}
                        />
                      ))}
                    </FieldGroup>
                    {applicazione === "soffitto" && panelType.unoCompatible && (
                      <FieldGroup label="Sistema binario">
                        <OptionRow selected={railSystem === "evo"} onClick={() => setRailSystem("evo")} label="Evo" />
                        <OptionRow selected={railSystem === "uno"} onClick={() => setRailSystem("uno")} label="Uno" />
                      </FieldGroup>
                    )}
                    <FieldGroup label={`Tipo binario (${railSystem === "uno" && applicazione === "soffitto" && panelType.unoCompatible ? "Uno" : "Evo"} ${isWall ? "a parete" : "a soffitto"})`}>
                      {railOptions.map((r) => (
                        <OptionRow
                          key={r.id}
                          selected={railTypeId === r.id}
                          onClick={() => setRailTypeId(r.id)}
                          label={r.label}
                          price={
                            railSystem === "uno" && applicazione === "soffitto" && panelType.unoCompatible && UNO_RAIL_CEILING[r.id]
                              ? `${euro(UNO_RAIL_CEILING[r.id].pricePerMl * MARKUP)}/ml`
                              : `${euro(r.pricePerMl * MARKUP)}/ml`
                          }
                        />
                      ))}
                    </FieldGroup>
                    {isWall && (
                      <p style={{ fontSize: 13, color: "#8A8577" }}>
                        Con applicazione a parete la lunghezza del binario è sempre il doppio della
                        larghezza vano.
                      </p>
                    )}
                    {(applicazione === "soffitto" || applicazione === "parete-soffitto") && BUILTIN_BEAM_BY_VIA[railTypeId] && (
                  <FieldGroup label="Trave da incasso">
                    <OptionRow selected={!travaIncasso} onClick={() => setTravaIncasso(false)} label="Senza trave da incasso" price="incluso" />
                    <OptionRow
                      selected={travaIncasso}
                      onClick={() => setTravaIncasso(true)}
                      label="Con trave da incasso per binario a soffitto"
                      price={`${euro(BUILTIN_BEAM_BY_VIA[railTypeId].pricePerMl * MARKUP)}/ml`}
                    />
                  </FieldGroup>
                )}
                  </>
                )}
              </StepBlock>
            )}

            {step === 3 && (
              <StepBlock title="3. Configurazione ante">
                <FieldGroup label="Numero ante">
                  {(collectionId === "and" ? [1] : collectionId === "sail" ? [1, 2] : [1, 2, 3, 4]).map((n) => (
                    <OptionRow key={n} selected={numAnte === n} onClick={() => setNumAnte(n)} label={`${n} ${n === 1 ? "anta" : "ante"}`} />
                  ))}
                </FieldGroup>
                {!["sail","and"].includes(collectionId) && (
                  <>
                  <FieldGroup label="Profilo di battuta (sempre incluso)">
                    {JAMB_TYPES.filter((j) => j.codeByVia[railTypeId]).map((j) => (
                      <OptionRow key={j.id} selected={jambTypeId === j.id} onClick={() => setJambTypeId(j.id)} label={j.label} />
                    ))}
                  </FieldGroup>
                  <NumberField
                    label="Quantità profilo di battuta"
                    value={profiloBattutaQty != null ? profiloBattutaQty : (parseInt(railTypeId, 10) || 1)}
                    onChange={setProfiloBattutaQty}
                  />
                  </>
                )}
                {isWall && !["sail","and"].includes(collectionId) && (
                  <p style={{ fontSize: 13, color: "#8A8577" }}>
                    Nelle configurazioni a parete viene aggiunta automaticamente la coppia di
                    tappi di chiusura.
                  </p>
                )}
              </StepBlock>
            )}

            {step === 4 && (
              <StepBlock title="4. Pannello">
                <FieldGroup label="Tipo pannello">
                  {panelTypesForCollection.map((p) => (
                    <OptionRow
                      key={p.id}
                      selected={panelTypeId === p.id}
                      onClick={() => {
                        setPanelTypeId(p.id);
                        setFinishId(p.finishes[0].id);
                        setGlassFinishNameId((GLASS_NAMED_FINISHES.find((g) => g.category === p.finishes[0].id) || {}).id || "neutro");
                        if (!p.hasDivisions) setDivision("intero");
                        setVariantId(null);
                        const entry = HANDLES_BY_COLLECTION[collectionId] || HANDLES;
                        const newHandles = Array.isArray(entry) ? entry : entry[p.id] || HANDLES;
                        if (!newHandles.find((h) => h.id === handleId)) {
                          setHandleId(newHandles[0].id);
                          setLockId("solo");
                        }
                      }}
                      label={p.label}
                    />
                  ))}
                </FieldGroup>
                {panelType.id === "vetro-singolo" ? (
                  <FieldGroup label="Finitura vetro">
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                      {GLASS_NAMED_FINISHES.filter(
                        (g) => panelType.finishes.find((f) => f.id === g.category) && (g.category !== "E" || GLASS_CAT_E_COLLECTIONS.includes(collectionId))
                      ).map((g) => {
                        const wIdxNow = Math.min(findBandIndex(panelType.widthBands || WIDTH_BANDS, larghezza / numAnte), panelType.widthCols - 1);
                        const catFinish = panelType.finishes.find((f) => f.id === g.category);
                        const pct = catFinish ? catFinish.value[wIdxNow] : null;
                        return (
                          <button
                            key={g.id}
                            onClick={() => {
                              setGlassFinishNameId(g.id);
                              setFinishId(g.category);
                            }}
                            title={g.label}
                            style={{
                              display: "flex",
                              flexDirection: "column",
                              alignItems: "center",
                              gap: 4,
                              padding: 6,
                              border: "1px solid " + (glassFinishNameId === g.id ? "#1B1B18" : "#DBD5C7"),
                              background: glassFinishNameId === g.id ? "#F6F4EF" : "#FFFFFF",
                              cursor: "pointer",
                              width: 84,
                            }}
                          >
                            <span style={{ width: 40, height: 28, background: g.color, border: "1px solid rgba(0,0,0,0.15)" }} />
                            <span style={{ fontSize: 9.5, textAlign: "center", lineHeight: 1.15 }}>{g.label}</span>
                            <span style={{ fontSize: 9, color: "#8A6A3E" }}>
                              Cat.{g.category} {pct ? `+${pct}%` : pct === 0 ? "incl." : ""}
                            </span>
                          </button>
                        );
                      })}
                    </div>
                  </FieldGroup>
                ) : (
                  <FieldGroup label="Finitura">
                    {panelType.finishes.map((f) => {
                      const wIdxNow = Math.min(findBandIndex(panelType.widthBands || WIDTH_BANDS, larghezza / numAnte), panelType.widthCols - 1);
                      const priceLabel =
                        f.type === "pct"
                          ? f.value[wIdxNow] === 0
                            ? "incluso"
                            : f.value[wIdxNow] == null
                            ? "non disp."
                            : `+${f.value[wIdxNow]}%`
                          : f.value === 0
                          ? "incluso"
                          : `+${euro(f.value * MARKUP)}`;
                      return <OptionRow key={f.id} selected={finishId === f.id} onClick={() => setFinishId(f.id)} label={f.label} price={priceLabel} />;
                    })}
                  </FieldGroup>
                )}
                {panelType.hasDivisions && (
                  <FieldGroup label="Divisioni">
                    {DIVISIONS.filter((d) => !panelType.availableDivisionIds || panelType.availableDivisionIds.includes(d.id)).map((d) => (
                      <OptionRow key={d.id} selected={division === d.id} onClick={() => setDivision(d.id)} label={d.label} price={d.delta ? `+${euro(d.delta * MARKUP)}` : "incluso"} />
                    ))}
                  </FieldGroup>
                )}
                {panelType.variants && (
                  <FieldGroup label="Variante anta (nessun sovrapprezzo)">
                    {panelType.variants
                      .filter((v) => {
                        const wIdxNow = Math.min(findBandIndex(panelType.widthBands || WIDTH_BANDS, larghezza / numAnte), panelType.widthCols - 1);
                        const wBandNow = (panelType.widthBands || WIDTH_BANDS)[wIdxNow];
                        return wBandNow.min >= v.min && wBandNow.max <= v.max;
                      })
                      .map((v) => (
                        <OptionRow key={v.id} selected={variantId === v.id} onClick={() => setVariantId(v.id)} label={`${v.label} (${v.code})`} />
                      ))}
                  </FieldGroup>
                )}
                {panelType.groovingOptions && (
                  <FieldGroup label="Pantografatura">
                    {panelType.groovingIncompatibleFinish && finishId === panelType.groovingIncompatibleFinish ? (
                      <p style={{ fontSize: 13, color: "#8A8577" }}>Non disponibile con la finitura selezionata.</p>
                    ) : (
                      panelType.groovingOptions.map((g) => (
                        <OptionRow key={g.id} selected={groovingId === g.id} onClick={() => setGroovingId(g.id)} label={g.label} price={g.delta ? `+${euro(g.delta * MARKUP)}` : "incluso"} />
                      ))
                    )}
                  </FieldGroup>
                )}
                {panelType.widthCols < 5 && (
                  <p style={{ fontSize: 13, color: "#8A8577" }}>
                    {panelType.label} non è disponibile oltre L 1300 mm per singola anta.
                  </p>
                )}
                {(FRAME_FINISH_COMPATIBILITY[collectionId] || []).length > 0 && (
                  <FieldGroup label="Finitura stipiti e telaio">
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                      {FRAME_FINISHES.filter((f) => (FRAME_FINISH_COMPATIBILITY[collectionId] || []).includes(f.id)).map((f) => (
                        <button
                          key={f.id}
                          onClick={() => setFrameFinishId(f.id)}
                          title={f.label}
                          style={{
                            display: "flex",
                            flexDirection: "column",
                            alignItems: "center",
                            gap: 4,
                            padding: 6,
                            border: "1px solid " + (frameFinishId === f.id ? "#1B1B18" : "#DBD5C7"),
                            background: frameFinishId === f.id ? "#F6F4EF" : "#FFFFFF",
                            cursor: "pointer",
                            width: 70,
                          }}
                        >
                          <span style={{ width: 28, height: 28, borderRadius: "50%", background: f.swatch, border: "1px solid rgba(0,0,0,0.15)" }} />
                          <span style={{ fontSize: 10, textAlign: "center", lineHeight: 1.1 }}>{f.label}</span>
                        </button>
                      ))}
                    </div>
                  </FieldGroup>
                )}
              </StepBlock>
            )}

            {step === 5 && (
              <StepBlock title="5. Maniglia e serratura">
                <FieldGroup label="Modello maniglia">
                  {handlesForCollection.map((h) => (
                    <OptionRow key={h.id} selected={handleId === h.id} onClick={() => { setHandleId(h.id); if (!h[lockId]) setLockId("solo"); }} label={h.label} price={`da +${euro(h.solo * MARKUP)}`} />
                  ))}
                </FieldGroup>
                <FieldGroup label="Sistema di chiusura">
                  {LOCK_TYPES.map((l) => {
                    const h = handlesForCollection.find((h) => h.id === handleId);
                    const price = h[l.id];
                    if (price == null) return null;
                    return <OptionRow key={l.id} selected={lockId === l.id} onClick={() => setLockId(l.id)} label={l.label} price={`+${euro(price * MARKUP)}`} />;
                  })}
                </FieldGroup>
              </StepBlock>
            )}

            {step === 6 && (
              <StepBlock title="6. Riepilogo preventivo">
                {breakdown.incompatible ? (
                  <div style={{ padding: 16, background: "#F5DCD8", border: "1px solid #B23B2E" }}>
                    <p style={{ fontSize: 14, color: "#7A2A20", margin: 0 }}>{breakdown.incompatibleReason}</p>
                  </div>
                ) : (
                <>
                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13.5 }}>
                  <thead>
                    <tr style={{ borderBottom: "1px solid #1B1B18" }}>
                      <th style={{ textAlign: "left", padding: "6px 4px" }}>Codice</th>
                      <th style={{ textAlign: "left", padding: "6px 4px" }}>Descrizione</th>
                      <th style={{ textAlign: "right", padding: "6px 4px" }}>Qtà</th>
                      <th style={{ textAlign: "right", padding: "6px 4px" }}>Unitario</th>
                      <th style={{ textAlign: "right", padding: "6px 4px" }}>Totale</th>
                    </tr>
                  </thead>
                  <tbody>
                    {breakdown.items.map((it, i) => (
                      <tr key={i} style={{ borderBottom: "1px solid #EEE9DD" }}>
                        <td style={{ padding: "8px 4px", fontFamily: "monospace" }}>{it.code}</td>
                        <td style={{ padding: "8px 4px" }}>{it.desc}</td>
                        <td style={{ padding: "8px 4px", textAlign: "right" }}>{it.qty}</td>
                        <td style={{ padding: "8px 4px", textAlign: "right" }}>{euro(it.unit)}</td>
                        <td style={{ padding: "8px 4px", textAlign: "right" }}>{euro(it.total)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                <div
                  style={{
                    display: "flex",
                    justifyContent: "space-between",
                    fontSize: 15,
                    paddingTop: 12,
                    marginTop: 8,
                    borderTop: "1px solid #DBD5C7",
                  }}
                >
                  <span>Totale merce</span>
                  <span>{euro(breakdown.total)}</span>
                </div>

                <div style={{ marginTop: 16, padding: 16, background: "#F6F4EF", border: "1px solid #DBD5C7" }}>
                  <div style={{ fontSize: 12, letterSpacing: "0.05em", color: "#8A6A3E", marginBottom: 10 }}>SCONTO</div>
                  <NumberField label="Sconto (%)" value={discountPct} onChange={setDiscountPct} />
                </div>

                <div
                  style={{
                    display: "flex",
                    justifyContent: "space-between",
                    fontFamily: "'Barlow Condensed', sans-serif",
                    fontSize: 22,
                    fontWeight: 600,
                    paddingTop: 16,
                    marginTop: 8,
                    borderTop: "2px solid #1B1B18",
                  }}
                >
                  <span>Totale netto</span>
                  <span>{euro(Math.max(0, breakdown.total * (1 - discountPct / 100)))}</span>
                </div>
                <p style={{ fontSize: 12, color: "#8A8577", marginTop: 16 }}>
                  Prezzi di listino (Albed V1.8 2025, p.236-251) maggiorati del 6%.
                </p>
                <button
                  className="no-print"
                  onClick={() => window.print()}
                  style={{
                    marginTop: 16,
                    display: "flex",
                    alignItems: "center",
                    gap: 6,
                    background: "#1B1B18",
                    color: "#F6F4EF",
                    border: "none",
                    padding: "10px 18px",
                    fontSize: 14,
                    cursor: "pointer",
                  }}
                >
                  Stampa / Salva PDF
                </button>
                </>
                )}
              </StepBlock>
            )}

            <div className="no-print" style={{ marginTop: 28, display: "flex", justifyContent: "space-between" }}>
              {activeSteps.findIndex((s) => s.id === step) > 0 ? (
                <button
                  onClick={goBack}
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: 6,
                    background: "transparent",
                    color: "#1B1B18",
                    border: "1px solid #DBD5C7",
                    padding: "10px 18px",
                    fontSize: 14,
                    cursor: "pointer",
                  }}
                >
                  <ChevronLeft size={16} /> Indietro
                </button>
              ) : (
                <div />
              )}
              {activeSteps.findIndex((s) => s.id === step) < activeSteps.length - 1 && (
                <button
                  onClick={goNext}
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: 6,
                    background: "#1B1B18",
                    color: "#F6F4EF",
                    border: "none",
                    padding: "10px 18px",
                    fontSize: 14,
                    cursor: "pointer",
                  }}
                >
                  Continua <ChevronRight size={16} />
                </button>
              )}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function StepBlock({ title, children }) {
  return (
    <div>
      <h2 style={{ fontFamily: "'Barlow Condensed', sans-serif", fontSize: 22, fontWeight: 600, marginTop: 0, marginBottom: 20 }}>
        {title}
      </h2>
      {children}
    </div>
  );
}

function FieldGroup({ label, children }) {
  return (
    <div style={{ marginBottom: 20 }}>
      <div style={{ fontSize: 12, letterSpacing: "0.05em", color: "#8A6A3E", marginBottom: 8 }}>{label.toUpperCase()}</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>{children}</div>
    </div>
  );
}

function NumberField({ label, value, onChange }) {
  return (
    <div style={{ flex: 1 }}>
      <div style={{ fontSize: 12, letterSpacing: "0.05em", color: "#8A6A3E", marginBottom: 8 }}>{label.toUpperCase()}</div>
      <input
        type="number"
        value={value}
        onChange={(e) => onChange(Number(e.target.value))}
        style={{
          width: "100%",
          padding: "10px 12px",
          border: "1px solid #DBD5C7",
          fontSize: 15,
          fontFamily: "inherit",
        }}
      />
    </div>
  );
}

const PANEL_COLORS = {
  "vetro-singolo": { fill: "#D7E7EC", stroke: "#8FA9B3", frame: "#3A3A36" },
  "doppio-vetro": { fill: "#C3D2D6", stroke: "#7C8F96", frame: "#3A3A36" },
  "pannello-legno": { fill: "#B08968", stroke: "#7A5C42", frame: "#3A3A36" },
  "pannello-cuoio": { fill: "#5C3A21", stroke: "#3B2414", frame: "#3A3A36" },
};

function PanelPreview({ numAnte, panelTypeId, division, larghezza, altezza, handleLabel, jambQty }) {
  const colors = PANEL_COLORS[panelTypeId] || PANEL_COLORS["vetro-singolo"];
  const antaW = Math.max(1, larghezza) / Math.max(1, numAnte);
  let aspect = Math.max(1, altezza) / antaW;
  aspect = Math.min(Math.max(aspect, 1.2), 3.2); // limita distorsioni estreme
  const unitW = 46;
  const unitH = Math.round(unitW * aspect);
  const frame = 4; // cornice esterna in alluminio
  const totalW = numAnte * unitW;
  const padding = 16;
  const svgW = totalW + frame * 2 + padding * 2 + 34; // spazio extra per la quota altezza a destra
  const svgH = unitH + frame * 2 + padding * 2;

  const rowsForDivision = division === "2div" ? 2 : division === "3div" ? 3 : division === "8div" ? 4 : division === "strip" ? 1 : 1;
  const rowH = unitH / rowsForDivision;

  // vista in pianta
  const planH = 46;
  const planW = totalW + frame * 2;
  const planTotalGap = 10;
  const jambPositions = [];
  const jCount = Math.max(0, Math.min(jambQty || 0, numAnte + 1));
  for (let i = 0; i < jCount; i++) {
    const t = jCount === 1 ? 0.5 : i / (jCount - 1);
    jambPositions.push(t);
  }

  return (
    <div>
      {/* prospetto frontale */}
      <svg width="100%" viewBox={`0 0 ${svgW} ${svgH}`} style={{ maxWidth: 260, display: "block", margin: "0 auto" }}>
        <rect x={padding} y={padding} width={totalW + frame * 2} height={unitH + frame * 2} fill="#EDEBE4" stroke={colors.frame} strokeWidth={1.5} />
        {Array.from({ length: numAnte }).map((_, i) => {
          const x = padding + frame + i * unitW;
          const y = padding + frame;
          return (
            <g key={i}>
              <rect x={x} y={y} width={unitW} height={unitH} fill={colors.fill} stroke={colors.frame} strokeWidth={1} />
              {panelTypeId === "vetro-singolo" &&
                division !== "strip" &&
                Array.from({ length: rowsForDivision - 1 }).map((_, r) => (
                  <line key={r} x1={x} x2={x + unitW} y1={y + rowH * (r + 1)} y2={y + rowH * (r + 1)} stroke={colors.stroke} strokeWidth={1} />
                ))}
              {panelTypeId === "vetro-singolo" && division === "strip" && (
                <g>
                  {Array.from({ length: 13 }).map((_, s) => (
                    <line key={s} x1={x} x2={x + unitW} y1={y + (unitH * (s + 1)) / 14} y2={y + (unitH * (s + 1)) / 14} stroke={colors.stroke} strokeWidth={0.5} />
                  ))}
                </g>
              )}
              {/* maniglia */}
              <rect x={x - 1.5} y={y + unitH * 0.42} width={3} height={unitH * 0.12} fill="#F4F2EC" stroke={colors.frame} strokeWidth={0.5} />
            </g>
          );
        })}
        {/* quota altezza */}
        <line x1={padding + totalW + frame * 2 + 10} x2={padding + totalW + frame * 2 + 10} y1={padding} y2={padding + unitH + frame * 2} stroke="#8A6A3E" strokeWidth={0.75} />
        <text x={padding + totalW + frame * 2 + 14} y={padding + (unitH + frame * 2) / 2} fontSize="9" fill="#8A6A3E" transform={`rotate(90 ${padding + totalW + frame * 2 + 14} ${padding + (unitH + frame * 2) / 2})`}>
          {Math.round(altezza)}
        </text>
      </svg>

      {/* vista in pianta */}
      <svg width="100%" viewBox={`0 0 ${svgW} ${planH + 30}`} style={{ maxWidth: 260, display: "block", margin: "6px auto 0" }}>
        <text x={svgW / 2} y={10} fontSize="9" fill="#8A6A3E" textAnchor="middle">
          Lvano={Math.round(larghezza)}
        </text>
        <line x1={padding} x2={padding + planW} y1={16} y2={16} stroke="#8A6A3E" strokeWidth={0.6} />
        <line x1={padding} x2={padding} y1={13} y2={19} stroke="#8A6A3E" strokeWidth={0.6} />
        <line x1={padding + planW} x2={padding + planW} y1={13} y2={19} stroke="#8A6A3E" strokeWidth={0.6} />

        <line x1={padding} x2={padding + planW} y1={30} y2={30} stroke={colors.frame} strokeWidth={2} />
        {jambPositions.map((t, i) => (
          <g key={i}>
            <line x1={padding + t * planW} x2={padding + t * planW} y1={25} y2={35} stroke="#B23B2E" strokeWidth={1.5} />
            <text x={padding + t * planW} y={22} fontSize="7" fill="#B23B2E" textAnchor="middle">
              M
            </text>
          </g>
        ))}
        <text x={svgW / 2} y={44} fontSize="8" fill="#8A6A3E" textAnchor="middle">
          L={Math.round(antaW)} × {numAnte} ante {handleLabel ? `— maniglia ${handleLabel}` : ""}
        </text>
      </svg>
    </div>
  );
}

function OptionRow({ selected, onClick, label, price }) {
  return (
    <button
      onClick={onClick}
      style={{
        display: "flex",
        justifyContent: "space-between",
        alignItems: "center",
        padding: "10px 14px",
        border: "1px solid " + (selected ? "#1B1B18" : "#DBD5C7"),
        background: selected ? "#F6F4EF" : "#FFFFFF",
        cursor: "pointer",
        fontSize: 14,
        textAlign: "left",
      }}
    >
      <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <span
          style={{
            width: 14,
            height: 14,
            borderRadius: "50%",
            border: "1px solid #1B1B18",
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            flexShrink: 0,
          }}
        >
          {selected && <span style={{ width: 7, height: 7, borderRadius: "50%", background: "#1B1B18" }} />}
        </span>
        {label}
      </span>
      {price && <span style={{ color: "#5C584E" }}>{price}</span>}
    </button>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Configuratore />);
</script>
</body>
</html>
